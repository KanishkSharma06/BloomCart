{% load static %}

<div class="product-card" style="border: 1px solid #ddd; padding: 12px; width: 200px; border-radius: 8px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    
    <!-- Product Card clickable area jo detail page par le jayega -->
    <a href="{% url 'product_detail' product.product_id %}" style="text-decoration: none; color: inherit; display: block; cursor: pointer;">
        {% if product.image %}
            <img src="{{ MEDIA_URL }}{{ product.image }}" alt="{{ product.name }}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
        {% else %}
            <img src="{% static 'images/default-product.png' %}" alt="No Image" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px;">
        {% endif %}

        <h3 style="font-size: 15px; margin: 10px 0 5px 0; font-weight: 600; color: #18181b;">{{ product.name }}</h3>
        <p style="font-weight: bold; color: #b45309; font-size: 14px; margin-bottom: 10px;">Price: ₹{{ product.price }}</p>
    </a>

    <!-- Add to Cart Form -->
    <form class="add-to-cart-form" data-product-id="{{ product.id }}" action="{% url 'add_to_cart_product' product.product_id %}" method="POST" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" style="width: 100%; background: #eab308; color: #000; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s;">
            Add to Cart
        </button>
    </form>
</div>
