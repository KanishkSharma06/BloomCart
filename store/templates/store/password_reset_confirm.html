{% extends 'store/base.html' %}
{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 15px;">Enter New Password</h2>
    <p style="text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 25px;">
        Please enter your new password twice so we can verify you typed it in correctly.
    </p>
    
    <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 5px;">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div style="color: #ef4444; font-size: 0.8rem; margin-top: 5px;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" style="width: 100%; border: none; cursor: pointer; padding: 12px; background-color: #6366f1; color: white; border-radius: 5px; font-weight: bold; margin-top: 10px;">Change My Password</button>
    </form>
</div>

<style>
    /* Django form fields styling helper */
    .auth-container input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .auth-container ul.errorlist {
        list-style: none;
        padding: 0;
        color: #ef4444;
        font-size: 0.8rem;
    }
</style>
{% endblock %}
