{% extends 'store/base.html' %}
{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; margin-bottom: 15px;">Reset Password</h2>
    <p style="text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 25px;">
        Enter your email address below, and we'll email you instructions for setting a new one.
    </p>
    
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 5px;">Email address:</label>
            <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
        </div>
        <button type="submit" style="width: 100%; border: none; cursor: pointer; padding: 12px; background-color: #6366f1; color: white; border-radius: 5px; font-weight: bold;">Send Reset Link</button>
    </form>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'login' %}" style="color: #6366f1; text-decoration: none; font-size: 0.9rem;">Back to Login</a>
    </div>
</div>
{% endblock %}
