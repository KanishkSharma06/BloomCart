<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BloomCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-2">
        <a class="navbar-brand fw-bold text-warning" href="#">BloomCart <span class="text-white fs-6">STORE</span></a>
    </nav>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh;">
        <div class="card p-4 shadow-sm border-0 rounded-4 bg-white" style="width: 450px;">
            <h3 class="fw-bold text-center mb-3" style="color: #232f3e;">Create Account</h3>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning py-2 small text-center" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- action="" rakha hai taaki 403 CSRF token mismatch error kabhi na aaye -->
            <form method="POST" action="">
                {% csrf_token %}
                
                {% if not otp_sent %}
                    <!-- STEP 1: Email -->
                    <div class="mb-3">
                        <label for="emailInput" class="form-label fw-semibold text-secondary small">Email</label>
                        <input type="email" id="emailInput" name="email" class="form-control" required autocomplete="email" placeholder="Email Address" value="{{ email }}">
                    </div>
                    
                    <button type="submit" name="action" value="send_otp" class="btn w-100 py-2 fw-semibold rounded-2 text-dark shadow-sm" style="background-color: #ffd814; border: 1px solid #fcd200;">
                        Send Verification OTP 📩
                    </button>
                
                {% else %}
                    <!-- STEP 2: Email, OTP, Username, Password -->
                    <div class="mb-3">
                        <label for="readonlyEmail" class="form-label fw-semibold text-secondary small">Email</label>
                        <input type="email" id="readonlyEmail" name="email" class="form-control bg-light" value="{{ email }}" readonly autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="otpInput" class="form-label fw-semibold text-secondary small">Enter 6-Digit OTP</label>
                        <input type="text" id="otpInput" name="otp" class="form-control text-center fs-4 tracking-widest fw-bold" maxlength="6" required autocomplete="one-time-code" placeholder="------">
                    </div>

                    <div class="mb-3">
                        <label for="usernameInput" class="form-label fw-semibold text-secondary small">Username</label>
                        <input type="text" id="usernameInput" name="username" class="form-control" required autocomplete="username" placeholder="Username">
                    </div>

                    <div class="mb-3">
                        <label for="passwordInput" class="form-label fw-semibold text-secondary small">Password</label>
                        <input type="password" id="passwordInput" name="password" class="form-control" required autocomplete="new-password" placeholder="At least 6 characters">
                        <div class="form-text text-muted" style="font-size: 11px;">
                            ℹ️ Passwords must be at least 6 characters long.
                        </div>
                    </div>
                    
                    <button type="submit" name="action" value="register" class="btn w-100 py-2 fw-semibold rounded-2 text-dark shadow-sm" style="background-color: #ffd814; border: 1px solid #fcd200;">
                        Create your BloomCart account 🚀
                    </button>
                {% endif %}
            </form>
            
            <div class="text-center mt-3 pt-2 border-top">
                <p class="small text-muted mb-0">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Sign-In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
