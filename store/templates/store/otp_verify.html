<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - BloomCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow p-4 border-0 rounded-4" style="width: 400px;">
        <h3 class="text-center mb-3 font-weight-bold">🔐 Verify Your Email</h3>
        <p class="text-muted text-center small">We have sent a 6-digit OTP to your registered email.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="otp" class="form-control text-center fs-4 tracking-widest" placeholder="Enter 6-digit OTP" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">Verify OTP 🚀</button>
        </form>
    </div>
</body>
</html>
