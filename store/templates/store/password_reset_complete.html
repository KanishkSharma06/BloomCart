{% extends 'store/base.html' %}
{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center;">
    <h2 style="margin-bottom: 15px; color: #10b981;">Password Reset Complete</h2>
    <p style="font-size: 0.9rem; color: #555; line-height: 1.5; margin-bottom: 25px;">
        Your password has been set. You may go ahead and log in now with your new credentials.
    </p>
    <a href="{% url 'login' %}" style="display: inline-block; padding: 12px 25px; background-color: #6366f1; color: white; border-radius: 5px; text-decoration: none; font-weight: bold;">Sign In Now</a>
</div>
{% endblock %}
